name: launchpad

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchpad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchpad}
      POSTGRES_DB: ${POSTGRES_DB:-launchpad}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-launchpad}
      PGPASSWORD: ${POSTGRES_PASSWORD:-launchpad}
      PGDATABASE: ${POSTGRES_DB:-launchpad}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend-net, frontend-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on: [backend]
    networks: [frontend-net]
    restart: unless-stopped

networks:
  frontend-net:

  # internal: no outside access; only the backend can reach the database
  backend-net:
    internal: true

volumes:
  db-data:
