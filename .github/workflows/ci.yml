name: Launchpad CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Build and Start the Stack
              run: docker compose up -d --build --wait

            - name: Check Frontend
              run: curl -fsS http://localhost:8080 > /dev/null

            - name: Check API and Database (through nginx)
              run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/api/health

            - name: Show Logs on Failure
              if: failure()
              run: docker compose logs

            - name: Stop the Stack
              if: always()
              run: docker compose down -v

    publish:
        name: Publish
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Login To DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Images
              run: |
                  TAG=$(date +'%Y%m%d')-${GITHUB_SHA::7}
                  for app in frontend backend; do
                      IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/launchpad-$app:$TAG
                      docker build -t "$IMAGE" ./$app
                      docker push "$IMAGE"
                  done
